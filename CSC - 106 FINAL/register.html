<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta charset="utf-8" />
<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/register.css">
<style>
  .msg {
    width: 100%;
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
    font-family: "Inter-Regular", Helvetica;
  }
  .msg.error { color: #ef4444; }
  .msg.success { color: #16a34a; }
</style>
</head>
<body>
<div class="register-page">
  <div class="register-screen">
    <div class="register-card">
      <div class="reg-logo">🏛️</div>
      <div class="reg-title">BARFS</div>
      <div class="reg-subtitle">Barangay Poblacion, Las Nieves</div>
      <div class="reg-desc">Register for Barangay Financial System</div>

      <div class="reg-label">Full Name</div>
      <input class="reg-input" id="fullName" type="text" placeholder="Enter your full name" />

      <div class="reg-label">Email Address</div>
      <input class="reg-input" id="email" type="email" placeholder="Enter your email" />

      <div class="reg-label">Password</div>
      <input class="reg-input" id="password" type="password" placeholder="Create a password" />

      <div class="reg-label">Confirm Password</div>
      <input class="reg-input" id="confirmPassword" type="password" placeholder="Confirm your password" />

      <div class="reg-label">Role</div>
      <div class="reg-select-wrapper">
        <select class="reg-select" id="role">
          <option value="Barangay Treasurer">Barangay Treasurer</option>
          <option value="Barangay Captain">Barangay Captain</option>
          <option value="COA Auditor">COA Auditor</option>
        </select>
      </div>

      <button class="reg-btn" id="registerBtn">Register</button>

      <div class="msg" id="msg"></div>

      <div class="reg-footer">
        Already have an account? <a href="index.html" class="reg-link">Sign in here</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('registerBtn').addEventListener('click', function () {
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const role = document.getElementById('role').value;
    const msg = document.getElementById('msg');

    msg.className = 'msg';
    msg.textContent = '';

    if (!fullName || !email || !password || !confirmPassword) {
      msg.classList.add('error');
      msg.textContent = 'Please fill in all fields.';
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      msg.classList.add('error');
      msg.textContent = 'Please enter a valid email address.';
      return;
    }

    if (password.length < 6) {
      msg.classList.add('error');
      msg.textContent = 'Password must be at least 6 characters.';
      return;
    }

    if (password !== confirmPassword) {
      msg.classList.add('error');
      msg.textContent = 'Passwords do not match.';
      return;
    }

    const users = JSON.parse(localStorage.getItem('barfs_users') || '[]');

    if (users.find(u => u.email === email)) {
      msg.classList.add('error');
      msg.textContent = 'An account with this email already exists.';
      return;
    }

    users.push({ fullName, email, password, role });
    localStorage.setItem('barfs_users', JSON.stringify(users));

    msg.classList.add('success');
    msg.textContent = 'Account created! Redirecting to login...';

    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
  });
</script>
</body>
</html>
